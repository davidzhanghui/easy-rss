<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>EasyRSS — Local-First RSS Reader</title>
    <meta name="description" content="A modern, local-first, frontend-only RSS reader. Subscribe, read, star and manage your feeds — all data stays in your browser." />
    <meta name="theme-color" content="#f3f1e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#23211c" media="(prefers-color-scheme: dark)" />
    <script>
      // Pre-paint theme resolution — must stay in sync with src/themes.ts
      // and the zustand persist shape in src/stores/appStore.ts.
      (function () {
        var LEGACY = { light: 'moss', dark: 'midnight', system: 'auto' };
        var DARK = { midnight: 1, dusk: 1, forest: 1 };
        var VALID = { moss: 1, claret: 1, indigo: 1, umber: 1, mulberry: 1, graphite: 1, teal: 1, midnight: 1, dusk: 1, forest: 1 };
        try {
          var raw = localStorage.getItem('easy-rss-settings');
          var s = raw ? (JSON.parse(raw).state || {}) : {};
          var pref = LEGACY[s.theme] || (s.theme === 'auto' ? 'auto' : (VALID[s.theme] ? s.theme : 'auto'));
          var light = VALID[s.autoLight] ? s.autoLight : 'moss';
          var deep = VALID[s.autoDark] ? s.autoDark : 'midnight';
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved = pref === 'auto' ? (sysDark ? deep : light) : pref;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.setAttribute('data-theme-pref', pref);
          document.documentElement.style.colorScheme = DARK[resolved] ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <meta property="og:title" content="EasyRSS — Local-First RSS Reader" />
    <meta property="og:description" content="Fast, minimal, immersive RSS reading. Local-first, no backend required." />
    <meta property="og:type" content="website" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
